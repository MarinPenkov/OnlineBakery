<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Категория | Sweet Heaven</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="topbar"><span>🚚 Доставка до адрес</span><span>☎ 0888 123 456</span><span>⏱ 09:00–20:00</span></div>
  <header class="site-header">
    <a class="logo" href="index.html"><span class="logo-mark">SH</span><span>Sweet Heaven</span></a>
    <button class="mobile-toggle" id="mobileToggle" aria-label="Меню">☰</button>
    <nav class="nav" id="mainNav">
      <a href="index.html">Начало</a>
      <div class="dropdown"><button class="dropbtn">Категории ▾</button><div class="dropdown-content" id="dropdownCategories"></div></div>
      <a href="about.html">За нас</a>
      <a href="cart.html" class="cart-link">Количка <span id="cartCount">0</span></a>
    </nav>
  </header>

  <main>
    <section class="page-hero">
      <p class="eyebrow">категория</p>
      <h1 id="categoryTitle">Категория</h1>
      <p id="categoryDescription"></p>
    </section>

    <section class="section catalog-layout">
      <aside class="filters-panel">
        <h3>Филтри</h3>
        <label>Търсене</label>
        <input id="searchInput" type="search" placeholder="Напр. шоколад, ягода..." />
        <label>Сортиране</label>
        <select id="sortSelect">
          <option value="default">Препоръчани</option>
          <option value="priceAsc">Цена ↑</option>
          <option value="priceDesc">Цена ↓</option>
          <option value="nameAsc">Име А–Я</option>
          <option value="best">Най-продавани</option>
        </select>
        <a class="btn btn-full" href="cart.html">Виж количката</a>
      </aside>
      <div class="catalog-content">
        <div class="catalog-toolbar"><span id="productCounter"></span><span class="muted">Виж като модерна продуктова мрежа</span></div>
        <div class="grid products" id="categoryProducts"></div>
      </div>
    </section>
  </main>

  <footer class="footer"><div><strong>Sweet Heaven</strong><p>Училищен проект</p></div><p>© 2026</p></footer>
  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
